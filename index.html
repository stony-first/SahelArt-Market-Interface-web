    <meta charset="UTF-8" />

    <title>SahelArt Market | L'Artisanat Authentique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#EA580C', // Vibrant Burnt Orange
              secondary: '#FFF7ED', // Very Pale Orange/Cream
              accent: '#FB923C', // Soft Orange
              olive: '#65A30D', // Lime/Olive Green
              terracotta: '#C2410C', // Darker Orange/Rust
              dark: '#431407', // Very Dark Brown/Orange
            },
            fontFamily: {
              serif: ['Merriweather', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'fade-in-down': 'fadeInDown 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #FFF7ED;
        color: #431407;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FFF7ED;
      }
      ::-webkit-scrollbar-thumb {
        background: #EA580C;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C2410C;
      }
    </style>
